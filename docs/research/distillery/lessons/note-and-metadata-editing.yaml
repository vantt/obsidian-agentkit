      - vault-conventions
    layer: content
    what: >-
      A property-type table (text, number, checkbox, date, datetime, list, links) with
      reserved names tags, aliases, cssclasses, and the rule that link-valued properties
      must be quoted.
    notable: >-
      Generic knowledge but compact (287 tokens) and it names the quoting trap. Does not tie
      types to the vault's own .obsidian/types.json, which is where type drift is decided.
    where:
